<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Focused & Object-Fit Cover Image Tour</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #050505; color: #fff; overflow-x: hidden; font-family: sans-serif; }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .scroll-track {
      height: 900vh;
      position: relative;
      z-index: 2;
      pointer-events: none;
    }

    .ui-layer {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>
  <div class="ui-layer">Scroll to navigate each frame &bull; Click to redirect</div>
  <div class="scroll-track"></div>

  <!-- CDN Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    // 1. SCENE SETUP
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.02);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 10);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // 2. LIGHTS
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xff0055, 2, 50);
    pointLight.position.set(0, 2, 5);
    scene.add(pointLight);

    // 3. ITEMS DATA
    const itemsData = [
      { 
        img: 'https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=1200&q=80', 
        url: 'https://example.com/page-1', 
        pos: [-3.5, 0, -10] 
      },
      { 
        img: 'https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1200&q=80', 
        url: 'https://example.com/page-2', 
        pos: [3.5, 0, -25] 
      },
      { 
        img: 'https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?auto=format&fit=crop&w=1200&q=80', 
        url: 'https://example.com/page-3', 
        pos: [-3.5, 0, -40] 
      },
      { 
        img: 'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=1200&q=80', 
        url: 'https://example.com/page-4', 
        pos: [3.5, 0, -55] 
      }
    ];

    const textureLoader = new THREE.TextureLoader();
    const interactiveMeshList = [];

    // --- HELPER FUNCTION: CSS OBJECT-FIT COVER FOR THREE.JS TEXTURE ---
    function applyCoverUV(texture, frameWidth, frameHeight) {
      const imageAspect = texture.image.width / texture.image.height;
      const frameAspect = frameWidth / frameHeight;

      texture.matrixAutoUpdate = false;

      if (imageAspect > frameAspect) {
        // Image broader hai: Width crop karo
        const scaleX = frameAspect / imageAspect;
        texture.matrix.set(
          scaleX, 0, (1 - scaleX) / 2,
          0, 1, 0,
          0, 0, 1
        );
      } else {
        // Image taller hai: Height crop karo
        const scaleY = imageAspect / frameAspect;
        texture.matrix.set(
          1, 0, 0,
          0, scaleY, (1 - scaleY) / 2,
          0, 0, 1
        );
      }
    }

    // 4. CREATING COVER-FITTED FRAMES
    const FRAME_WIDTH = 4;
    const FRAME_HEIGHT = 2.25; // Fixed 16:9 Frame Size

    itemsData.forEach((data) => {
      const group = new THREE.Group();

      textureLoader.load(data.img, (texture) => {
        // Apply Cover Fit Logic
        applyCoverUV(texture, FRAME_WIDTH, FRAME_HEIGHT);

        // Image Mesh (Fixed 16:9 Plane)
        const imgGeo = new THREE.PlaneGeometry(FRAME_WIDTH, FRAME_HEIGHT);
        const imgMat = new THREE.MeshStandardMaterial({ map: texture, side: THREE.DoubleSide });
        const imgMesh = new THREE.Mesh(imgGeo, imgMat);

        // Border Mesh
        const borderGeo = new THREE.PlaneGeometry(FRAME_WIDTH + 0.2, FRAME_HEIGHT + 0.2);
        const borderMat = new THREE.MeshBasicMaterial({ color: 0x111115, side: THREE.DoubleSide });
        const borderMesh = new THREE.Mesh(borderGeo, borderMat);
        borderMesh.position.z = -0.01;

        group.add(imgMesh);
        group.add(borderMesh);
        group.position.set(...data.pos);

        imgMesh.userData = { targetUrl: data.url, parentGroup: group };
        interactiveMeshList.push(imgMesh);
      });

      scene.add(group);
    });

    // 5. CAMERA LOOKAT TARGET VECTOR
    const cameraTarget = new THREE.Vector3(0, 0, 0);

    // 6. GSAP TIMELINE FOR STEP-BY-STEP FRAME FOCUS
    const timeline = gsap.timeline({
      scrollTrigger: {
        trigger: ".scroll-track",
        start: "top top",
        end: "bottom bottom",
        scrub: 1.2
      }
    });

    itemsData.forEach((item, index) => {
      // Step A: Move camera directly in front of frame
      timeline.to(camera.position, {
        x: item.pos[0],
        y: item.pos[1],
        z: item.pos[2] + 4.5, // 4.5 units in front for clean centered view
        duration: 2,
        ease: "power1.inOut"
      }, `step-${index}`);

      // Step B: Direct focus to frame center
      timeline.to(cameraTarget, {
        x: item.pos[0],
        y: item.pos[1],
        z: item.pos[2],
        duration: 2,
        ease: "power1.inOut"
      }, `step-${index}`);
    });

    // 7. RAYCASTER (Hover & Click Redirection)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredMesh = null;

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshList);

      if (intersects.length > 0) {
        document.body.style.cursor = 'pointer';
        const hitMesh = intersects[0].object;

        if (hoveredMesh !== hitMesh) {
          if (hoveredMesh) gsap.to(hoveredMesh.userData.parentGroup.scale, { x: 1, y: 1, z: 1, duration: 0.3 });
          hoveredMesh = hitMesh;
          gsap.to(hoveredMesh.userData.parentGroup.scale, { x: 1.05, y: 1.05, z: 1.05, duration: 0.3 });
        }
      } else {
        document.body.style.cursor = 'default';
        if (hoveredMesh) {
          gsap.to(hoveredMesh.userData.parentGroup.scale, { x: 1, y: 1, z: 1, duration: 0.3 });
          hoveredMesh = null;
        }
      }
    });

    window.addEventListener('click', () => {
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshList);

      if (intersects.length > 0) {
        const url = intersects[0].object.userData.targetUrl;
        window.location.href = url;
      }
    });

    // 8. RENDER LOOP
    function animate() {
      requestAnimationFrame(animate);

      // Continuously point camera to target frame
      camera.lookAt(cameraTarget);

      renderer.render(scene, camera);
    }
    animate();

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

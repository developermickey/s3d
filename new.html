<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Focused & Original Color Image Tour</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #050505; color: #fff; overflow-x: hidden; font-family: sans-serif; }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .scroll-track {
      height: 900vh;
      position: relative;
      z-index: 2;
      pointer-events: none;
    }

    .ui-layer {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>
  <div class="ui-layer">Scroll to navigate each frame &bull; Click to redirect</div>
  <div class="scroll-track"></div>

  <!-- CDN Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    // 1. SCENE SETUP
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.02);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 10);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    // Original exact colors render karne ke liye sRGB Encoding
    renderer.outputEncoding = THREE.sRGBEncoding;

    // 2. CLEAN WHITE LIGHTING (Red Tint Light Removed)
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); // Pure white light
    scene.add(ambientLight);

    // 3. ITEMS DATA
    const itemsData = [
      { 
        img: './img/1.png', 
        url: 'https://example.com/page-1', 
        pos: [-3.5, 0, -10] 
      },
      { 
        img: './img/2.png', 
        url: 'https://example.com/page-2', 
        pos: [3.5, 0, -25] 
      },
      { 
        img: './img/2.png', 
        url: 'https://example.com/page-3', 
        pos: [-3.5, 0, -40] 
      },
      { 
        img: './img/4.png', 
        url: 'https://example.com/page-4', 
        pos: [3.5, 0, -55] 
      }
    ];

    const textureLoader = new THREE.TextureLoader();
    const interactiveMeshList = [];

    // --- HELPER FUNCTION: CSS OBJECT-FIT COVER FOR THREE.JS TEXTURE ---
    function applyCoverUV(texture, frameWidth, frameHeight) {
      const imageAspect = texture.image.width / texture.image.height;
      const frameAspect = frameWidth / frameHeight;

      texture.matrixAutoUpdate = false;

      if (imageAspect > frameAspect) {
        const scaleX = frameAspect / imageAspect;
        texture.matrix.set(
          scaleX, 0, (1 - scaleX) / 2,
          0, 1, 0,
          0, 0, 1
        );
      } else {
        const scaleY = imageAspect / frameAspect;
        texture.matrix.set(
          1, 0, 0,
          0, scaleY, (1 - scaleY) / 2,
          0, 0, 1
        );
      }
    }

    // 4. CREATING FRAMES WITH ORIGINAL IMAGE COLORS
    const FRAME_WIDTH = 4;
    const FRAME_HEIGHT = 2.25;

    itemsData.forEach((data) => {
      const group = new THREE.Group();

      textureLoader.load(data.img, (texture) => {
        // Texture Color Correction
        texture.encoding = THREE.sRGBEncoding;
        
        applyCoverUV(texture, FRAME_WIDTH, FRAME_HEIGHT);

        // MeshBasicMaterial use karne se shadow ya light overlay ke bina ORIGINAL IMAGE dikhegi
        const imgGeo = new THREE.PlaneGeometry(FRAME_WIDTH, FRAME_HEIGHT);
        const imgMat = new THREE.MeshBasicMaterial({ 
          map: texture, 
          side: THREE.DoubleSide 
        });
        const imgMesh = new THREE.Mesh(imgGeo, imgMat);

        // Subtle Dark Border
        const borderGeo = new THREE.PlaneGeometry(FRAME_WIDTH + 0.15, FRAME_HEIGHT + 0.15);
        const borderMat = new THREE.MeshBasicMaterial({ color: 0x222225, side: THREE.DoubleSide });
        const borderMesh = new THREE.Mesh(borderGeo, borderMat);
        borderMesh.position.z = -0.01;

        group.add(imgMesh);
        group.add(borderMesh);
        group.position.set(...data.pos);

        imgMesh.userData = { targetUrl: data.url, parentGroup: group };
        interactiveMeshList.push(imgMesh);
      });

      scene.add(group);
    });

    // 5. CAMERA TARGET
    const cameraTarget = new THREE.Vector3(0, 0, 0);

    // 6. GSAP SCROLL FOCUS
    const timeline = gsap.timeline({
      scrollTrigger: {
        trigger: ".scroll-track",
        start: "top top",
        end: "bottom bottom",
        scrub: 1.2
      }
    });

    itemsData.forEach((item, index) => {
      timeline.to(camera.position, {
        x: item.pos[0],
        y: item.pos[1],
        z: item.pos[2] + 4.5,
        duration: 2,
        ease: "power1.inOut"
      }, `step-${index}`);

      timeline.to(cameraTarget, {
        x: item.pos[0],
        y: item.pos[1],
        z: item.pos[2],
        duration: 2,
        ease: "power1.inOut"
      }, `step-${index}`);
    });

    // 7. RAYCASTER (Hover & Click)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredMesh = null;

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshList);

      if (intersects.length > 0) {
        document.body.style.cursor = 'pointer';
        const hitMesh = intersects[0].object;

        if (hoveredMesh !== hitMesh) {
          if (hoveredMesh) gsap.to(hoveredMesh.userData.parentGroup.scale, { x: 1, y: 1, z: 1, duration: 0.3 });
          hoveredMesh = hitMesh;
          gsap.to(hoveredMesh.userData.parentGroup.scale, { x: 1.05, y: 1.05, z: 1.05, duration: 0.3 });
        }
      } else {
        document.body.style.cursor = 'default';
        if (hoveredMesh) {
          gsap.to(hoveredMesh.userData.parentGroup.scale, { x: 1, y: 1, z: 1, duration: 0.3 });
          hoveredMesh = null;
        }
      }
    });

    window.addEventListener('click', () => {
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshList);

      if (intersects.length > 0) {
        const url = intersects[0].object.userData.targetUrl;
        window.location.href = url;
      }
    });

    // 8. RENDER LOOP
    function animate() {
      requestAnimationFrame(animate);
      camera.lookAt(cameraTarget);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

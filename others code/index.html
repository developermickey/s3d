<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Scroll Sequence with Clickable Hotspots</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #000; overflow-x: hidden; font-family: sans-serif; }

    /* Canvas full screen sticky rehega */
    #hero-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* Track height jo scroll depth create karega */
    .scroll-container {
      height: 500vh; /* Smooth scrolling ke liye distance */
      position: relative;
    }

    /* Hotspot Container (Canvas ke upar layered) */
    .hotspot-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none; /* Mouse passes through when not active */
    }

    /* Clickable Hotspots */
    .hotspot {
      position: absolute;
      padding: 12px 20px;
      background: rgba(255, 0, 85, 0.85);
      color: white;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      opacity: 0;
      transform: scale(0.8);
      transition: transform 0.3s ease, background 0.3s ease;
      pointer-events: auto; /* Enable click on active hotspot */
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
    }

    .hotspot:hover {
      transform: scale(1.1);
      background: rgba(255, 0, 85, 1);
    }
  </style>
</head>
<body>

  <!-- Background Canvas -->
  <canvas id="hero-canvas"></canvas>

  <!-- Clickable Interactive Overlays -->
  <div class="hotspot-layer">
    <!-- Spot 1: Appears around frame 30-60 -->
    <div class="hotspot" id="spot1" style="top: 40%; left: 25%;" onclick="navigateTo('page1.html')">
      Explore Tyre Tech &rarr;
    </div>

    <!-- Spot 2: Appears around frame 100-140 -->
    <div class="hotspot" id="spot2" style="top: 50%; right: 20%;" onclick="navigateTo('page2.html')">
      View Hall of Fame &rarr;
    </div>
  </div>

  <!-- Scroll Space -->
  <div class="scroll-container"></div>

  <!-- GSAP Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const canvas = document.getElementById("hero-canvas");
    const context = canvas.getContext("2d");

    // Canvas size setup
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Total frames count
    const frameCount = 150; 

    // Image URL generator function (Frame_0001.jpg format)
    const currentFrame = (index) => 
      `https://www.example.com/frames/frame_${(index + 1).toString().padStart(4, '0')}.jpg`;

    const images = [];
    const airpods = { frame: 0 };

    // 1. Preload all images smooth playback ke liye
    for (let i = 0; i < frameCount; i++) {
      const img = new Image();
      img.src = currentFrame(i);
      images.push(img);
    }

    // Canvas Par Frame Draw Karna
    function render() {
      context.clearRect(0, 0, canvas.width, canvas.height);
      const img = images[airpods.frame];
      if (img && img.complete) {
        // Image aspect ratio maintain karke full screen draw karna
        let hRatio = canvas.width / img.width;
        let vRatio = canvas.height / img.height;
        let ratio = Math.max(hRatio, vRatio);
        let centerShift_x = (canvas.width - img.width * ratio) / 2;
        let centerShift_y = (canvas.height - img.height * ratio) / 2;

        context.drawImage(
          img,
          0, 0, img.width, img.height,
          centerShift_x, centerShift_y, img.width * ratio, img.height * ratio
        );
      }
    }

    // Pehla frame Load hone par render karna
    images[0].onload = render;

    // 2. GSAP Timeline Scroll Sequence
    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: ".scroll-container",
        start: "top top",
        end: "bottom bottom",
        scrub: 0.5, // Smooth scrubbing speed
      }
    });

    // Animate Frame Sequence
    tl.to(airpods, {
      frame: frameCount - 1,
      snap: "frame",
      ease: "none",
      onUpdate: render
    });

    // 3. Hotspots Dynamic Visibility based on Scroll/Frames
    // Hotspot 1 Reveal (e.g., Timeline ke start-middle mein)
    tl.to("#spot1", { opacity: 1, scale: 1, duration: 0.1 }, 0.2) // 20% scroll par show
      .to("#spot1", { opacity: 0, scale: 0.8, duration: 0.1 }, 0.4); // 40% scroll par hide

    // Hotspot 2 Reveal (e.g., Timeline ke end part mein)
    tl.to("#spot2", { opacity: 1, scale: 1, duration: 0.1 }, 0.6) // 60% scroll par show
      .to("#spot2", { opacity: 0, scale: 0.8, duration: 0.1 }, 0.85); // 85% scroll par hide

    // 4. Click Navigation Handler
    function navigateTo(url) {
      // Optional: Aap direct page navigate kar sakte ho ya GSAP transition de sakte ho
      document.body.style.opacity = '0';
      document.body.style.transition = 'opacity 0.5s ease';
      setTimeout(() => {
        window.location.href = url;
      }, 500);
    }

    // Window Resize Handling
    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      render();
    });
  </script>
</body>
</html>

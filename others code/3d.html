<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Interactive Scroll - Three.js + GSAP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #050505; color: #fff; overflow-x: hidden; font-family: sans-serif; }

    /* WebGL Canvas Top Fix Position */
    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Scrollable height to drive the GSAP Camera Animation */
    .scroll-track {
      height: 600vh;
      position: relative;
      z-index: 2;
      pointer-events: none;
    }

    /* UI Overlay Guide */
    .ui-layer {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>
  <div class="ui-layer">Scroll Down to Explore &bull; Click Images to Visit Page</div>
  <div class="scroll-track"></div>

  <!-- Three.js & GSAP CDNs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    // 1. SCENE, CAMERA & RENDERER SETUP
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    
    // Smooth Fog Effect Background Depth Ke Liye
    scene.fog = new THREE.FogExp2(0x050505, 0.03);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 8);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // 2. LIGHTING
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xff0055, 2, 50);
    pointLight.position.set(0, 2, 5);
    scene.add(pointLight);

    // 3. CREATING INTERACTIVE 3D IMAGE PLANES
    const textureLoader = new THREE.TextureLoader();

    // Apni images aur redirect links yahan set karein
    const itemsData = [
      { 
        img: 'https://picsum.photos/id/1018/800/600', 
        url: 'https://example.com/page-1', 
        pos: [2.5, 0, -5] 
      },
      { 
        img: 'https://picsum.photos/id/1015/800/600', 
        url: 'https://example.com/page-2', 
        pos: [-2.5, -1, -15] 
      },
      { 
        img: 'https://picsum.photos/id/1019/800/600', 
        url: 'https://example.com/page-3', 
        pos: [2.5, 0.5, -25] 
      },
      { 
        img: 'https://picsum.photos/id/1025/800/600', 
        url: 'https://example.com/page-4', 
        pos: [-2, 0, -35] 
      }
    ];

    const interactiveMeshList = [];

    itemsData.forEach((data) => {
      const texture = textureLoader.load(data.img);
      const geometry = new THREE.PlaneGeometry(3.5, 2.3);
      const material = new THREE.MeshStandardMaterial({ 
        map: texture, 
        side: THREE.DoubleSide,
        roughness: 0.2 
      });
      
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(...data.pos);
      
      // Store redirect link inside mesh custom data
      mesh.userData = { targetUrl: data.url, originalScale: { x: 1, y: 1, z: 1 } };

      scene.add(mesh);
      interactiveMeshList.push(mesh);
    });

    // 4. GSAP CAMERA SCROLL ANIMATION
    gsap.to(camera.position, {
      z: -42, // Z-axis forward camera movement
      ease: "none",
      scrollTrigger: {
        trigger: ".scroll-track",
        start: "top top",
        end: "bottom bottom",
        scrub: 1 // Smooth camera control
      }
    });

    // 5. RAYCASTER FOR MOUSE HOVER & CLICK DETECTION
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredObject = null;

    // Mouse Move Event (Hover Effect)
    window.addEventListener('mousemove', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshList);

      if (intersects.length > 0) {
        document.body.style.cursor = 'pointer';
        if (hoveredObject !== intersects[0].object) {
          // Reset previous
          if (hoveredObject) gsap.to(hoveredObject.scale, { x: 1, y: 1, duration: 0.3 });
          
          // Hover target
          hoveredObject = intersects[0].object;
          gsap.to(hoveredObject.scale, { x: 1.1, y: 1.1, duration: 0.3 }); // Scale UP
        }
      } else {
        document.body.style.cursor = 'default';
        if (hoveredObject) {
          gsap.to(hoveredObject.scale, { x: 1, y: 1, duration: 0.3 });
          hoveredObject = null;
        }
      }
    });

    // Click Event (Navigation handling)
    window.addEventListener('click', () => {
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshList);

      if (intersects.length > 0) {
        const targetUrl = intersects[0].object.userData.targetUrl;
        
        // Click transition animation before redirecting
        gsap.to(intersects[0].object.rotation, {
          y: Math.PI * 2,
          duration: 0.6,
          onComplete: () => {
            window.location.href = targetUrl;
          }
        });
      }
    });

    // 6. ANIMATION RENDER LOOP
    function animate() {
      requestAnimationFrame(animate);
      
      // Floating animation for images (Subtle motion)
      interactiveMeshList.forEach((mesh, index) => {
        mesh.position.y += Math.sin(Date.now() * 0.002 + index) * 0.002;
      });

      renderer.render(scene, camera);
    }
    animate();

    // 7. RESPONSIVE RESIZE
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

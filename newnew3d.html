<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Focused Frame Tour - Three.js + GSAP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #030305; color: #fff; overflow-x: hidden; font-family: sans-serif; }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Scroll space */
    .scroll-track {
      height: 1000vh;
      position: relative;
      z-index: 2;
      pointer-events: none;
    }

    .ui-layer {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 22px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>
  <div class="ui-layer">Scroll Down to Focus Images &bull; Click to Open Link</div>
  <div class="scroll-track"></div>

  <!-- CDN Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    // 1. SCENE SETUP
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030305, 0.02);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 10);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // 2. LIGHTING
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // 3. IMAGES & FRAMES POSITIONS (Alternate Left & Right)
    const itemsData = [
      { 
        img: 'https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=1200&q=80', 
        url: 'https://unsplash.com', 
        pos: [-4, 0, -10] // Left Frame
      },
      { 
        img: 'https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1200&q=80', 
        url: 'https://google.com', 
        pos: [4, 0, -25] // Right Frame
      },
      { 
        img: 'https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?auto=format&fit=crop&w=1200&q=80', 
        url: 'https://github.com', 
        pos: [-4, 0, -40] // Left Frame
      },
      { 
        img: 'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=1200&q=80', 
        url: 'https://threejs.org', 
        pos: [4, 0, -55] // Right Frame
      }
    ];

    const textureLoader = new THREE.TextureLoader();
    const interactiveMeshList = [];

    itemsData.forEach((data) => {
      const group = new THREE.Group();

      // Image Mesh
      const texture = textureLoader.load(data.img);
      const imgGeo = new THREE.PlaneGeometry(4, 2.25); 
      const imgMat = new THREE.MeshStandardMaterial({ map: texture, side: THREE.DoubleSide });
      const imgMesh = new THREE.Mesh(imgGeo, imgMat);

      // Frame Border Mesh
      const borderGeo = new THREE.PlaneGeometry(4.25, 2.5);
      const borderMat = new THREE.MeshBasicMaterial({ color: 0x111115, side: THREE.DoubleSide });
      const borderMesh = new THREE.Mesh(borderGeo, borderMat);
      borderMesh.position.z = -0.01;

      group.add(imgMesh);
      group.add(borderMesh);
      group.position.set(...data.pos);

      // Save references
      imgMesh.userData = { targetUrl: data.url, parentGroup: group };

      scene.add(group);
      interactiveMeshList.push(imgMesh);
    });

    // 4. DYNAMIC CAMERA TARGET OBJECT (Used to animate camera.lookAt via GSAP)
    const cameraTarget = new THREE.Vector3(0, 0, 0);

    // 5. GSAP TIMELINE FOR EXACT FRAME FOCUS
    const timeline = gsap.timeline({
      scrollTrigger: {
        trigger: ".scroll-track",
        start: "top top",
        end: "bottom bottom",
        scrub: 1.2
      }
    });

    // Loop through frames and animate camera directly in front of each image
    itemsData.forEach((item, index) => {
      // Step A: Camera moves in front of the image frame (Z-distance offset by +5 for perfect view)
      timeline.to(camera.position, {
        x: item.pos[0],
        y: item.pos[1],
        z: item.pos[2] + 5,
        duration: 2,
        ease: "power1.inOut"
      }, `step-${index}`);

      // Step B: Target vector smoothly looks directly at the frame center
      timeline.to(cameraTarget, {
        x: item.pos[0],
        y: item.pos[1],
        z: item.pos[2],
        duration: 2,
        ease: "power1.inOut"
      }, `step-${index}`);
    });

    // 6. RAYCASTER (Hover & Click Redirection)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredMesh = null;

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshList);

      if (intersects.length > 0) {
        document.body.style.cursor = 'pointer';
        const hitMesh = intersects[0].object;

        if (hoveredMesh !== hitMesh) {
          if (hoveredMesh) gsap.to(hoveredMesh.userData.parentGroup.scale, { x: 1, y: 1, z: 1, duration: 0.3 });
          hoveredMesh = hitMesh;
          gsap.to(hoveredMesh.userData.parentGroup.scale, { x: 1.08, y: 1.08, z: 1.08, duration: 0.3 });
        }
      } else {
        document.body.style.cursor = 'default';
        if (hoveredMesh) {
          gsap.to(hoveredMesh.userData.parentGroup.scale, { x: 1, y: 1, z: 1, duration: 0.3 });
          hoveredMesh = null;
        }
      }
    });

    window.addEventListener('click', () => {
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshList);

      if (intersects.length > 0) {
        const url = intersects[0].object.userData.targetUrl;
        window.location.href = url;
      }
    });

    // 7. RENDER LOOP
    function animate() {
      requestAnimationFrame(animate);

      // Camera continuously focuses on the dynamic cameraTarget Vector
      camera.lookAt(cameraTarget);

      renderer.render(scene, camera);
    }
    animate();

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
